<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindLink - Login</title>
  <link rel="stylesheet" href="style.css">

  <!-- Internal CSS for Login Page -->
  <style>
   

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Login Card */
    .login-box {
      background: white;
      padding: 30px;
      border-radius: 12px;
       box-shadow: #FFD700;
     /* box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);*/
      width: 350px;
      animation: fadeIn 1.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h2 {
      text-align: center;
      color: #0a58ca;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin: 10px 0 5px;
      font-weight: bold;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
      transition: border-color 0.3s;
    }

    input:focus {
      border-color: #0a58ca;
      outline: none;
    }

    .remember {
      margin: 10px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button {
      background-color: #0a58ca;
      color: white;
      border: none;
      padding: 12px;
      width: 100%;
      font-size: 1.1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background-color: #084298;
    }

    .signup-link {
      text-align: center;
      margin-top: 15px;
    }

    .signup-link a {
      color: #0a58ca;
      text-decoration: none;
      font-weight: bold;
    }

    .signup-link a:hover {
      text-decoration: underline;
    }

    /* Feedback message box */
    #feedback {
      text-align: center;
      margin-top: 15px;
      display: none;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.95rem;
    }
    .login-box:hover{
      transform: scale(1.03) ;
     
    }

  
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="logo">
      <img src="Bck2.mpg" alt="MindLink Logo">MindLink</div>
    <h1>MindLink</h1>
    <p>Welcome Back - Please Login</p>
    <nav >
            <a href="index.html">Home</a>
            <a href="resources.html">Resources</a>
            <a href="mood.html">Mood Tracker</a>
            <a href="contact.html">Contact</a>
            <a href="login.html">Login/sign Up</a>
        </nav>
  </header>

  <!-- MAIN LOGIN FORM -->
  <main>
    <div class="login-box">
      <h2>Login</h2>
      <form onsubmit="return loginUser(event)">
        <label for="email">Email Address:</label>
        <input type="email" id="email" placeholder="example@gmail.com" required>

        <label for="password">Password:</label>
        <input type="password" id="password" placeholder="Enter your password" required>

        <div class="remember">
          <input type="checkbox" id="remember">
          <label for="remember">Remember me</label>
        </div>

        <button type="submit">Login</button>
      </form>

      <div id="feedback"></div>

      <div class="signup-link">
        <p>Don’t have an account? <a href="signup.html">Sign Up</a></p>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy;<span id="year"></span> MindLink Project by Ebale Emmanuel | All Rights Reserved</p>
  </footer>
  <!--External Javascript file-->
    <script src="script.js"></script>

  <!-- INTERNAL JAVASCRIPT -->
  <script>
    function loginUser(event) {
      event.preventDefault(); // Prevents actual form submission

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const feedback = document.getElementById("feedback");

      // Simulated validation
      if (email === "user@mindlink.com" && password === "12345") {
        feedback.style.display = "block";
        feedback.style.backgroundColor = "#d4edda";
        feedback.style.color = "#155724";
        feedback.innerText = "✅ Login successful! Welcome back to MindLink.";
      } else {
        feedback.style.display = "block";
        feedback.style.backgroundColor = "#f8d7da";
        feedback.style.color = "#721c24";
        feedback.innerText = "❌ Invalid email or password. Try again.";
      }
    }
  </script>
</body>
</html>
